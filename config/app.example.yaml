# Copy this file to config/app.yaml for local use. The local file is ignored by Git.
web:
  # Security boundary: the only supported listener is exact IPv4 loopback.
  host: 127.0.0.1
  port: 8765

tushare:
  # Verified Tushare-compatible HTTPS endpoint. Never downgrade this to plain HTTP.
  api_url: https://api.quicksync.cn
  # Optional verified provider IP; bypass DNS/proxies while keeping this URL's TLS identity.
  # Leave null for the official SDK's default route. Recheck the address if the provider moves.
  connect_ip: null
  timeout_seconds: 30
  token: replace-with-your-tushare-token

ai:
  # DeepSeek uses an OpenAI-compatible Chat Completions endpoint with a few
  # provider-specific request fields. Store the API key directly here and
  # change the other values for another reviewed OpenAI-compatible service.
  profile: DEEPSEEK
  display_name: DeepSeek
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  additional_models:
    - display_name: DeepSeek Pro
      model: deepseek-v4-pro
  api_key: replace-with-your-deepseek-api-key
  timeout_seconds: 30
  max_retries: 2
  max_input_chars: 50000
  max_output_tokens: 4096
  temperature: 0.0

# Database, backup, and webhook settings are runtime-composition inputs and are not
# accepted by the current strict ApplicationConfiguration schema.
